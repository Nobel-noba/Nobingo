[program:nobingo-reverb]
command=php /var/www/nobingo/artisan reverb:start --host=0.0.0.0 --port=8080 --hostname=nobingo.yourdomain.com
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/nobingo-reverb.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=60
